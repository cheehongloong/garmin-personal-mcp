<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Synthetic example of Claude answering a training recovery question using Garmin Connect Personal MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf9f5"/>
      <stop offset="100%" stop-color="#f3f1ea"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="880" height="560" rx="16" fill="url(#bg)"/>

  <!-- Window Frame -->
  <rect x="24" y="20" width="832" height="520" rx="14" fill="#ffffff" stroke="#e5e2d9" stroke-width="1.2" filter="url(#shadow)"/>

  <!-- Top Bar -->
  <rect x="24" y="20" width="832" height="44" rx="14" fill="#f7f5ee"/>
  <rect x="24" y="50" width="832" height="14" fill="#f7f5ee"/>
  <line x1="24" y1="64" x2="856" y2="64" stroke="#e5e2d9" stroke-width="1"/>
  <circle cx="48" cy="42" r="5.5" fill="#e57368"/>
  <circle cx="66" cy="42" r="5.5" fill="#eab354"/>
  <circle cx="84" cy="42" r="5.5" fill="#63b967"/>
  <text x="440" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#4b4840">Claude — Garmin Personal MCP (Synthetic Data Example)</text>

  <!-- User Message -->
  <rect x="240" y="84" width="584" height="52" rx="12" fill="#f2efe7"/>
  <text x="260" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#2c2a26">Should I run my 10 km threshold session today, or swap it for an easy run?</text>
  <text x="260" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#767268">Using connector: Garmin Connect Personal MCP</text>

  <!-- Tool Call Pill -->
  <rect x="56" y="152" width="420" height="34" rx="8" fill="#f6f8fb" stroke="#d9e2ec" stroke-width="1"/>
  <circle cx="74" cy="169" r="5" fill="#16a34a"/>
  <text x="88" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#334155">recovery_snapshot(days=7) · list_activities(limit=5)</text>

  <!-- Assistant Response Container -->
  <text x="56" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#1f1e1b">Go for the threshold session — your recovery metrics look solid.</text>

  <!-- Metric Cards Row -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Sleep -->
    <rect x="56" y="232" width="180" height="74" rx="10" fill="#faf9f5" stroke="#e5e2d9"/>
    <text x="72" y="253" font-size="11.5" font-weight="600" fill="#6b675d">SLEEP SCORE</text>
    <text x="72" y="280" font-size="22" font-weight="700" fill="#1f1e1b">84 <tspan font-size="12" font-weight="500" fill="#16a34a">/ 100</tspan></text>
    <text x="72" y="297" font-size="11.5" fill="#6b675d">7h 48m · 1h 42m deep</text>

    <!-- HRV -->
    <rect x="252" y="232" width="180" height="74" rx="10" fill="#faf9f5" stroke="#e5e2d9"/>
    <text x="268" y="253" font-size="11.5" font-weight="600" fill="#6b675d">OVERNIGHT HRV</text>
    <text x="268" y="280" font-size="22" font-weight="700" fill="#1f1e1b">62 <tspan font-size="12" font-weight="500" fill="#16a34a">ms</tspan></text>
    <text x="268" y="297" font-size="11.5" fill="#6b675d">7-day avg: 59 ms (balanced)</text>

    <!-- Body Battery -->
    <rect x="448" y="232" width="180" height="74" rx="10" fill="#faf9f5" stroke="#e5e2d9"/>
    <text x="464" y="253" font-size="11.5" font-weight="600" fill="#6b675d">BODY BATTERY</text>
    <text x="464" y="280" font-size="22" font-weight="700" fill="#1f1e1b">88 <tspan font-size="12" font-weight="500" fill="#16a34a">peak</tspan></text>
    <text x="464" y="297" font-size="11.5" fill="#6b675d">+64 overnight recharge</text>

    <!-- Stress -->
    <rect x="644" y="232" width="180" height="74" rx="10" fill="#faf9f5" stroke="#e5e2d9"/>
    <text x="660" y="253" font-size="11.5" font-weight="600" fill="#6b675d">AVG STRESS (7D)</text>
    <text x="660" y="280" font-size="22" font-weight="700" fill="#1f1e1b">24 <tspan font-size="12" font-weight="500" fill="#16a34a">low</tspan></text>
    <text x="660" y="297" font-size="11.5" fill="#6b675d">Yesterday: 21</text>
  </g>

  <!-- Summary Bullet Points -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#2c2a26">
    <text x="56" y="336">• <tspan font-weight="600">Recovery trend:</tspan> HRV is slightly above your 7-day baseline (62 ms vs 59 ms) with consistent sleep</text>
    <text x="68" y="356">and low daytime stress, indicating good readiness for high-aerobic work.</text>

    <text x="56" y="384">• <tspan font-weight="600">Recent load:</tspan> Your last hard effort was 72 hours ago (easy 6 km recovery jog yesterday at</text>
    <text x="68" y="404">Zone 2 HR), so legs should be fresh enough for threshold pacing.</text>

    <text x="56" y="432">• <tspan font-weight="600">Suggested guardrails:</tspan> Warm up 15 min easy, hold Zone 4 for the threshold block, and back off</text>
    <text x="68" y="452">if HR drifts above your Zone 4 ceiling early.</text>
  </g>

  <!-- Footer Disclaimer -->
  <line x1="56" y1="484" x2="824" y2="484" stroke="#ece9e0" stroke-width="1"/>
  <text x="56" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#767268">Illustrative mockup using 100% synthetic metrics. No real user data is included in this repository.</text>
</svg>
